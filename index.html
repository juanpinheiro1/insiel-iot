<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insiel IoT</title>
<meta name="description" content="Supervisao e automacao de dispositivos — Insiel Tecnologia Eletronica">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EEF2F6; --ink:#0A1A2A; --muted:#5B6773; --line:#D9E0E7;
  --brand:#0078B5; --brand-soft:#E3F1F9; --ok:#1E8E5A; --ok-soft:#E1F4EA; --warn:#B7791F; --warn-soft:#FBF0DB;
  --crit:#D23428; --crit-soft:#FBE4E2; --info:#3C5A78; --info-soft:#E6EDF4; --shadow:0 1px 2px rgba(10,26,42,.06),0 4px 14px rgba(10,26,42,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B141D; --surface:#132030; --surface2:#0F1A26; --ink:#E6EDF3; --muted:#93A3B3; --line:#223243;
  --brand:#3FA3DC; --brand-soft:#123449; --ok:#4CC488; --ok-soft:#123826; --warn:#E0A64A; --warn-soft:#3A2C12;
  --crit:#F0655A; --crit-soft:#44201D; --info:#8FB0CF; --info-soft:#1A2C3E; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0B141D; --surface:#132030; --surface2:#0F1A26; --ink:#E6EDF3; --muted:#93A3B3; --line:#223243;
  --brand:#3FA3DC; --brand-soft:#123449; --ok:#4CC488; --ok-soft:#123826; --warn:#E0A64A; --warn-soft:#3A2C12;
  --crit:#F0655A; --crit-soft:#44201D; --info:#8FB0CF; --info-soft:#1A2C3E; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Sora',system-ui,sans-serif;margin:0;line-height:1.2}
h1{font-size:20px} h2{font-size:17px;margin-bottom:12px} h3{font-size:14px}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700;font-size:17px;color:var(--ink);white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px}
nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
nav button.on{background:var(--brand-soft);color:var(--brand)}
nav button .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;margin-left:4px;text-align:center}
.sp{flex:1}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:'Sora';font-size:22px;font-weight:600;margin-top:2px}
.kpi .v.ok{color:var(--ok)} .kpi .v.crit{color:var(--crit)} .kpi .v.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s}
.card:hover{transform:translateY(-1px)}
.card .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.card .nm{font-family:'Sora';font-weight:600;font-size:15px;flex:1}
.card .sub{font-size:12px;color:var(--muted)}
.vals{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0}
.val .b{font-family:'Sora';font-size:24px;font-weight:600;line-height:1.1}
.val .u{font-size:13px;color:var(--muted);margin-left:2px}
.val .l{font-size:12px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.muted{background:var(--surface2);color:var(--muted)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit)} .btn.ok{background:var(--ok)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:140px;flex:1}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.empty{color:var(--muted);padding:24px;text-align:center}
.login{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.login .switch{display:flex;gap:4px;background:var(--surface2);border-radius:9px;padding:3px;margin:16px 0}
.login .switch button{flex:1;border:0;background:none;padding:7px;border-radius:7px;color:var(--muted);font-weight:600}
.login .switch button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.login .fld{margin-bottom:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:99;max-width:90vw}
.sev-critico{border-left:4px solid var(--crit)} .sev-aviso{border-left:4px solid var(--warn)} .sev-info{border-left:4px solid var(--info)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ev .t{font-weight:600} .ev .d{font-size:13px;color:var(--muted)}
.ev .acts{margin-left:auto;display:flex;gap:6px}
.chartwrap{position:relative;height:300px}
.back{background:none;border:0;color:var(--brand);font-weight:600;padding:0;margin-bottom:10px;font-size:14px}
.mini{font-size:12px;color:var(--muted)}
.tog{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;border:0;padding:0}
.tog.on{background:var(--ok)}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.tog.on:after{left:19px}
@media (max-width:640px){ .who{display:none} .topin{gap:8px} h1{font-size:18px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var SB_URL='https://puepmnyffpfjttxmwfjt.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1ZXBtbnlmZnBmanR0eG13Zmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTMzMzksImV4cCI6MjEwNTIyOTMzOX0.6waSiEVZE0Fm2QraExivstM8qjzK7NGQ6698wmzHxjw';
var sb=window.supabase.createClient(SB_URL,SB_KEY,{db:{schema:'iot'}});

var S={perfis:[],perfil:null,view:'geral',dispId:null,disp:[],grand:{},locais:[],tipos:[],fontes:[],eventos:[],regras:[],agendas:[],
       evFiltro:'abertos',chartCode:null,chartPer:24,chart:null,regraEdit:null,agendaEdit:null,timer:null};
var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

// ---------- utilitarios ----------
function el(id){return document.getElementById(id)}
function val(id){return (el(id).value||'').trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,ms){var t=el('toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(function(){t.hidden=true},ms||3200)}
function fail(e){console.error(e);toast('Erro: '+(e&&e.message?e.message:e),5000)}
function fmtN(v,dec){if(v==null||isNaN(v))return '–';return Number(v).toLocaleString('pt-BR',{maximumFractionDigits:dec==null?1:dec})}
function fmtDT(s){if(!s)return '–';var d=new Date(s);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function ago(s){if(!s)return 'nunca';var m=Math.round((Date.now()-new Date(s).getTime())/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';var h=Math.floor(m/60);if(h<48)return 'há '+h+' h';return 'há '+Math.floor(h/24)+' d'}
function isAdmin(){return S.perfil&&S.perfil.papel==='admin'}
var ENUM_PT={cancel:'normal',upperalarm:'acima do limite',loweralarm:'abaixo do limite',alarm:'alarme',normal:'normal',c:'°C',f:'°F',on:'ligado',off:'desligado',power_on:'ligado ao religar',power_off:'desligado ao religar',memory:'lembra o estado'};
var SEV={critico:'crit',aviso:'warn',info:'info'};
var TIPO_EV={regra:'Regra',offline:'Sem comunicacao',bateria_baixa:'Bateria baixa',sem_reporte:'Sem reporte',erro_fonte:'Falha na integracao',comando:'Falha de comando'};
function unidade(u){return u==='℃'?'°C':(u||'')}
function fmtVal(g,v){
  if(v==null)return '–';
  if(g&&g.tipo_valor==='Boolean')return (v===1||v===true||v==='true')?'Ligado':'Desligado';
  if(typeof v==='number')return fmtN(v,g&&g.escala?g.escala:1);
  return ENUM_PT[v]||String(v);
}
function gDe(dId,code){var gs=S.grand[dId]||[];for(var i=0;i<gs.length;i++)if(gs[i].codigo===code)return gs[i];return null}
function dispNome(id){for(var i=0;i<S.disp.length;i++)if(S.disp[i].id===id)return S.disp[i].nome;return '?'}
function dispById(id){for(var i=0;i<S.disp.length;i++)if(S.disp[i].id===id)return S.disp[i];return null}
function ordemLeitura(a,b){var o={va_temperature:1,va_humidity:2,switch_1:3,switch:3,watersensor_state:3,cur_power:4,cur_current:5,cur_voltage:6,add_ele:7,battery_percentage:90};return (o[a.codigo]||50)-(o[b.codigo]||50)}

// ---------- dados ----------
async function loadBase(){
  var cid=S.perfil.cliente_id;
  var r=await Promise.all([
    sb.from('dispositivos').select('*, tipos_dispositivo(nome), locais(nome)').eq('cliente_id',cid).order('nome'),
    sb.from('grandezas').select('*'),
    sb.from('locais').select('*').eq('cliente_id',cid).order('nome'),
    sb.from('eventos').select('*').eq('cliente_id',cid).order('aberto_em',{ascending:false}).limit(300),
    sb.from('regras').select('*').eq('cliente_id',cid).order('nome'),
    sb.from('v_fontes').select('*').eq('cliente_id',cid),
    sb.from('tipos_dispositivo').select('*').order('nome'),
    sb.from('agendas').select('*').eq('cliente_id',cid).order('nome')
  ]);
  for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;
  S.disp=r[0].data;S.grand={};
  r[1].data.forEach(function(g){(S.grand[g.dispositivo_id]=S.grand[g.dispositivo_id]||[]).push(g)});
  S.locais=r[2].data;S.eventos=r[3].data;S.regras=r[4].data;S.fontes=r[5].data;S.tipos=r[6].data;S.agendas=r[7].data;
}
function localNome(id){for(var i=0;i<S.locais.length;i++)if(S.locais[i].id===id)return S.locais[i].nome;return id?'?':'Todos os locais'}
// grandezas comandaveis disponiveis num escopo (local e/ou dispositivo), uma por codigo
function codigosComandaveis(localId,dispId){
  var m={};S.disp.forEach(function(d){if(dispId&&d.id!==dispId)return;if(!dispId&&localId&&d.local_id!==localId)return;
    (S.grand[d.id]||[]).forEach(function(g){if(g.comandavel&&!m[g.codigo])m[g.codigo]=g})});
  return Object.keys(m).sort().map(function(k){return m[k]});
}
function valInputHtml(id,cur,gg){
  if(!gg)return '<input id="'+id+'" value="'+esc(cur==null?'':JSON.stringify(cur))+'" placeholder="valor">';
  if(gg.tipo_valor==='Boolean')return '<select id="'+id+'"><option value="true"'+(cur===true?' selected':'')+'>Ligar</option><option value="false"'+(cur===false?' selected':'')+'>Desligar</option><option value=""'+(cur==null?' selected':'')+'>(nenhum)</option></select>';
  if(gg.tipo_valor==='Enum')return '<select id="'+id+'"><option value="">(nenhum)</option>'+((gg.faixa||{}).range||[]).map(function(o){return '<option value="'+esc(o)+'"'+(o===cur?' selected':'')+'>'+esc(ENUM_PT[o]||o)+'</option>'}).join('')+'</select>';
  return '<input id="'+id+'" type="number" step="any" value="'+(cur==null?'':cur/Math.pow(10,gg.escala||0))+'">';
}
// agenda ligada agora? (mesma logica do banco, no fuso do navegador, so para exibicao)
function agendaLigadaAgora(a){
  var n=new Date(),dia=n.getDay(),h=n.getHours()*60+n.getMinutes();
  function m(t){var p=t.split(':');return Number(p[0])*60+Number(p[1])}
  var li=m(a.hora_ligar),de=m(a.hora_desligar),data=n.toISOString().slice(0,10);
  if(de>li)return a.dias.indexOf(dia)>-1&&a.excecoes.indexOf(data)<0&&h>=li&&h<de;
  if(h>=li)return a.dias.indexOf(dia)>-1&&a.excecoes.indexOf(data)<0;
  var ontem=new Date(n.getTime()-86400000);return a.dias.indexOf((dia+6)%7)>-1&&a.excecoes.indexOf(ontem.toISOString().slice(0,10))<0&&h<de;
}
async function refresh(){try{await loadBase();render();}catch(e){fail(e)}}

// ---------- render ----------
function render(){
  if(!S.perfil){renderLogin();return}
  var abertos=S.eventos.filter(function(e){return e.status!=='fechado'}).length;
  var h='<div class="top"><div class="topin">'+
    '<div class="logo"><i>&#9673;</i> Insiel IoT</div>'+
    '<nav>'+['geral|Visao geral','eventos|Eventos','regras|Regras','agendas|Agendas','config|Configuracoes'].map(function(x){var p=x.split('|');
      return '<button class="'+((S.view===p[0]||(p[0]==='geral'&&S.view==='disp'))?'on':'')+'" onclick="A.go(\''+p[0]+'\')">'+p[1]+(p[0]==='eventos'&&abertos?'<span class="n">'+abertos+'</span>':'')+'</button>'}).join('')+'</nav>'+
    '<div class="sp"></div>';
  if(S.perfis.length>1){h+='<select class="mini" onchange="A.trocaCliente(this.value)" style="padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">'+S.perfis.map(function(p){return '<option value="'+p.cliente_id+'"'+(p.cliente_id===S.perfil.cliente_id?' selected':'')+'>'+esc(p.cliente)+'</option>'}).join('')+'</select>'}
  else h+='<span class="who">'+esc(S.perfil.cliente)+'</span>';
  h+='<button class="btn sec sm" onclick="A.sair()">Sair</button></div></div><main id="main"></main>';
  el('app').innerHTML=h;
  ({geral:renderGeral,disp:renderDisp,eventos:renderEventos,regras:renderRegras,agendas:renderAgendas,config:renderConfig})[S.view]();
}

function renderLogin(){
  el('app').innerHTML='<div class="login"><div class="logo"><i>&#9673;</i> Insiel IoT</div><p class="mini" style="margin:6px 0 0">Supervisao e automacao de dispositivos</p>'+
  '<div class="switch"><button id="sw-in" class="on" onclick="A.swLogin(true)">Entrar</button><button id="sw-up" onclick="A.swLogin(false)">Primeiro acesso</button></div>'+
  '<div id="f-in"><div class="fld"><label>E-mail</label><input id="li-email" type="email" autocomplete="username"></div>'+
  '<div class="fld"><label>Senha</label><input id="li-senha" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')A.login()"></div>'+
  '<button class="btn" style="width:100%" onclick="A.login()">Entrar</button></div>'+
  '<div id="f-up" hidden><p class="mini">Use o e-mail que foi autorizado para a sua empresa.</p><div class="fld"><label>E-mail</label><input id="su-email" type="email"></div>'+
  '<div class="fld"><label>Senha (min. 8)</label><input id="su-senha" type="password"></div><div class="fld"><label>Repita a senha</label><input id="su-senha2" type="password"></div>'+
  '<button class="btn" style="width:100%" onclick="A.signup()">Criar acesso</button></div></div>';
}

function statusChip(d){
  if(d.online===true)return '<span class="chip ok"><span class="dot"></span>online</span>';
  if(d.online===false)return '<span class="chip crit"><span class="dot"></span>offline</span>';
  return '<span class="chip muted">sem dados</span>';
}
function batChip(d){
  var b=d.estado_atual&&d.estado_atual.battery_percentage;if(b==null)return '';
  return '<span class="chip '+(b<=15?'crit':b<=30?'warn':'muted')+'">&#9889; '+fmtN(b,0)+'%</span>';
}

function renderGeral(){
  var on=S.disp.filter(function(d){return d.online===true}).length;
  var abertos=S.eventos.filter(function(e){return e.status!=='fechado'});
  var crit=abertos.filter(function(e){return e.severidade==='critico'}).length;
  var f=S.fontes[0];
  var h='<div class="kpis">'+
    '<div class="kpi"><div class="l">Dispositivos online</div><div class="v '+(on===S.disp.length?'ok':'warn')+'">'+on+' / '+S.disp.length+'</div></div>'+
    '<div class="kpi"><div class="l">Eventos abertos</div><div class="v '+(crit?'crit':abertos.length?'warn':'ok')+'">'+abertos.length+'</div></div>'+
    '<div class="kpi"><div class="l">Regras ativas</div><div class="v">'+S.regras.filter(function(r){return r.ativa}).length+'</div></div>'+
    '<div class="kpi"><div class="l">Ultima coleta</div><div class="v '+(f&&f.ultimo_erro?'crit':'')+'" style="font-size:16px">'+(f?ago(f.ultima_coleta_em):'–')+'</div><div class="mini">'+(f&&f.ultimo_erro?esc(f.ultimo_erro):'a cada 5 min')+'</div></div>'+
    '</div>';
  h+='<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>Dispositivos</h1><button class="btn sec sm" id="btn-col" onclick="A.coletarAgora()">&#8635; Atualizar agora</button></div>';
  if(!S.disp.length)h+='<div class="panel empty">Nenhum dispositivo. Va em Configuracoes e sincronize a integracao.</div>';
  function cardHtml(d,mostraLocal){
    var gs=(S.grand[d.id]||[]).filter(function(g){return g.papel==='leitura'&&g.gravar&&g.codigo!=='battery_percentage'}).sort(ordemLeitura);
    var evs=abertos.filter(function(e){return e.dispositivo_id===d.id});
    return '<div class="card'+(evs.some(function(e){return e.severidade==='critico'})?' sev-critico':evs.length?' sev-aviso':'')+'" onclick="A.abrir(\''+d.id+'\')">'+
      '<div class="hd"><div><div class="nm">'+esc(d.nome)+'</div><div class="sub">'+[mostraLocal&&d.locais&&d.locais.nome,d.tipos_dispositivo&&d.tipos_dispositivo.nome].filter(Boolean).map(esc).join(' · ')+'</div></div>'+statusChip(d)+'</div>'+
      '<div class="vals">'+gs.slice(0,4).map(function(g){var v=d.estado_atual?d.estado_atual[g.codigo]:null;
        return '<div class="val"><div class="b">'+fmtVal(g,v)+'<span class="u">'+(typeof v==='number'&&g.tipo_valor!=='Boolean'?esc(unidade(g.unidade)):'')+'</span></div><div class="l">'+esc(g.nome)+'</div></div>'}).join('')+'</div>'+
      '<div class="foot">'+batChip(d)+(evs.length?'<span class="chip '+(evs.some(function(e){return e.severidade==='critico'})?'crit':'warn')+'">'+evs.length+' evento'+(evs.length>1?'s':'')+'</span>':'')+

  }
  // com mais de um local, agrupa por local (loja, galpao...) com resumo no cabecalho
  var agrupar=S.locais.length>1;
  if(!agrupar){h+='<div class="grid">'+S.disp.map(function(d){return cardHtml(d,true)}).join('')+'</div>'}
  else{
    var grupos=S.locais.map(function(l){return {nome:l.nome,id:l.id,ds:S.disp.filter(function(d){return d.local_id===l.id})}});
    var semLocal=S.disp.filter(function(d){return !d.local_id});if(semLocal.length)grupos.push({nome:'Sem local',id:null,ds:semLocal});
    grupos.forEach(function(g){
      if(!g.ds.length)return;
      var gon=g.ds.filter(function(d){return d.online===true}).length;
      var gev=abertos.filter(function(e){return g.ds.some(function(d){return d.id===e.dispositivo_id})});
      var temp=null;g.ds.forEach(function(d){if(temp==null&&d.estado_atual&&typeof d.estado_atual.va_temperature==='number')temp=d.estado_atual.va_temperature});
      h+='<div class="panel" style="padding:12px 16px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">'+esc(g.nome)+'</h2><div class="row">'+
        (temp!=null?'<span class="chip muted">'+fmtN(temp)+' °C</span>':'')+
        '<span class="chip '+(gon===g.ds.length?'ok':'crit')+'">'+gon+'/'+g.ds.length+' online</span>'+
        (gev.length?'<span class="chip '+(gev.some(function(e){return e.severidade==='critico'})?'crit':'warn')+'">'+gev.length+' evento'+(gev.length>1?'s':'')+'</span>':'<span class="chip ok">sem eventos</span>')+
        '</div></div><div class="grid">'+g.ds.map(function(d){return cardHtml(d,false)}).join('')+'</div></div>';
    });
  }
  el('main').innerHTML=h;
}

        '<td><select id="g-papel-'+g.id+'" style="padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px">'+['leitura','estado','config'].map(function(p){return '<option value="'+p+'"'+(p===g.papel?' selected':'')+'>'+p+'</option>'}).join('')+'</select></td>'+
        '<td><button class="tog '+(g.gravar?'on':'')+'" id="g-grav-'+g.id+'" onclick="this.classList.toggle(\'on\')"></button></td>'+
        '<td><button class="btn sec sm" onclick="A.grandezaSalvar(\''+g.id+'\')">Salvar</button></td></tr>'}).join('')+'</table></div></div>';
  }
  el('main').innerHTML=h;
  if(numer.length)loadChart().catch(fail);

async function loadChart(){
  var d=dispById(S.dispId),g=gDe(d.id,S.chartCode);if(!g)return;
  var desde=new Date(Date.now()-S.chartPer*3600000).toISOString();
  var r=await sb.from('leituras').select('valor,instante').eq('dispositivo_id',d.id).eq('codigo',S.chartCode).gte('instante',desde).order('instante').limit(5000);
  if(r.error)throw r.error;
  var pts=r.data.filter(function(x){return x.valor!=null});
  if(pts.length&&d.estado_atual&&d.estado_atual[S.chartCode]!=null)pts.push({valor:d.estado_atual[S.chartCode],instante:new Date().toISOString()});
  var css=getComputedStyle(document.documentElement);
  var brand=css.getPropertyValue('--brand').trim(),muted=css.getPropertyValue('--muted').trim(),line=css.getPropertyValue('--line').trim();
  if(S.chart){S.chart.destroy();S.chart=null}
  var vals=pts.map(function(p){return Number(p.valor)});
  var info=el('chart-info');
  if(!pts.length){info.textContent='Sem leituras no periodo.';return}
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
  info.innerHTML=pts.length+' pontos · min '+fmtN(mn)+' · media '+fmtN(avg)+' · max '+fmtN(mx)+' '+esc(unidade(g.unidade));
  S.chart=new Chart(el('chart'),{type:'line',data:{labels:pts.map(function(p){return fmtDT(p.instante)}),datasets:[{data:vals,borderColor:brand,backgroundColor:brand+'22',fill:true,tension:.25,pointRadius:pts.length>150?0:2.5,borderWidth:2,stepped:g.tipo_valor==='Boolean'}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return fmtVal(g,c.parsed.y)+' '+unidade(g.unidade)}}}},
      scales:{x:{ticks:{color:muted,maxTicksLimit:8,maxRotation:0},grid:{color:line}},y:{ticks:{color:muted},grid:{color:line},suggestedMin:g.tipo_valor==='Boolean'?0:undefined,suggestedMax:g.tipo_valor==='Boolean'?1:undefined}}}});
}
async function loadUltimas(){
  var d=dispById(S.dispId);
  var r=await sb.from('leituras').select('codigo,valor,valor_texto,instante').eq('dispositivo_id',d.id).order('instante',{ascending:false}).limit(40);
  if(r.error)throw r.error;var box=el('ult');if(!box)return;
  if(!r.data.length){box.innerHTML='<div class="empty">Nenhuma leitura gravada ainda.</div>';return}
  box.innerHTML='<table><tr><th>Quando</th><th>Grandeza</th><th>Valor</th></tr>'+r.data.map(function(l){var g=gDe(d.id,l.codigo);
    return '<tr><td>'+fmtDT(l.instante)+'</td><td>'+esc(g?g.nome:l.codigo)+'</td><td><b>'+(l.valor!=null?fmtVal(g,Number(l.valor))+' '+esc(g&&g.tipo_valor!=='Boolean'?unidade(g.unidade):''):fmtVal(g,l.valor_texto))+'</b></td></tr>'}).join('')+'</table>';
}

    '<div class="fld"><label>Limite'+(g&&g.unidade?' ('+esc(unidade(g.unidade))+')':'')+'</label>'+(isNum?(g.tipo_valor==='Boolean'?'<select id="r-lim"><option value="1"'+(r.limite==1?' selected':'')+'>Ligado</option><option value="0"'+(r.limite==0?' selected':'')+'>Desligado</option></select>':'<input id="r-lim" type="number" step="any" value="'+(r.limite==null?'':r.limite)+'">'):

function lerValor(id,gg){
  var e=el(id);if(!e)return null;var v=e.value;if(v==='')return null;
  if(!gg){try{return JSON.parse(v)}catch(x){return v}}
  if(gg.tipo_valor==='Boolean')return v==='true';
  if(gg.tipo_valor==='Enum')return v;
  return Math.round(Number(v)*Math.pow(10,gg.escala||0));
}

function agendaLerForm(){
  var a=S.agendaEdit;a.nome=val('a-nome');a.hora_ligar=val('a-hl');a.hora_desligar=val('a-hd');a.reenviar_min=Number(val('a-re'))||30;
  a.dias=DIAS.map(function(_,i){return el('a-dia-'+i)&&el('a-dia-'+i).checked?i:-1}).filter(function(i){return i>=0});
  a.excecoes=val('a-exc').split(',').map(function(s){s=s.trim();var m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:null}).filter(Boolean);
  var cods=codigosComandaveis(a.local_id,a.dispositivo_id);var g=cods.filter(function(x){return x.codigo===a.codigo})[0];
  a.valor_ligar=lerValor('a-vl',g);a.valor_desligar=lerValor('a-vd',g);

}

  regraCancelar:function(){S.regraEdit=null;renderRegras()},
  regraCampo:function(k,v){var r=S.regraEdit;r.nome=val('r-nome');r[k]=v||null;if(k==='dispositivo_id')r.codigo=null;if(k==='acao_dispositivo_id')r.acao_codigo=null;renderRegras()},
  regraSalvar:async function(){try{var r=S.regraEdit;var g=gDe(el('r-disp').value,el('r-cod').value);var isNum=g&&(g.tipo_valor==='Integer'||g.tipo_valor==='Boolean');
    var p={cliente_id:S.perfil.cliente_id,nome:val('r-nome'),dispositivo_id:el('r-disp').value,codigo:el('r-cod').value,operador:el('r-op').value,
      limite:isNum?Number(val('r-lim')):null,limite_texto:isNum?null:val('r-lim'),histerese:Number(val('r-hist'))||0,duracao_min:Number(val('r-dur'))||0,intervalo_min:Number(val('r-int'))||0,
      severidade:el('r-sev').value,acao_tipo:el('r-acao').value,acao_dispositivo_id:null,acao_codigo:null,acao_valor:null,acao_valor_normal:null,ativa:r.ativa!==false};
    if(!p.nome)throw new Error('De um nome a regra.');if(isNum&&isNaN(p.limite))throw new Error('Informe o limite.');
    if(p.acao_tipo==='comando'){p.acao_dispositivo_id=val('r-adisp')||null;p.acao_codigo=val('r-acod')||null;if(!p.acao_dispositivo_id||!p.acao_codigo)throw new Error('Escolha o dispositivo e o comando da acao.');
      var ag=gDe(p.acao_dispositivo_id,p.acao_codigo);p.acao_valor=lerValor('r-aval',ag);p.acao_valor_normal=lerValor('r-avaln',ag);if(p.acao_valor==null)throw new Error('Informe o valor do comando ao disparar.')}
    if(r.id){p.estado='normal';p.condicao_desde=null}
    var q=r.id?sb.from('regras').update(p).eq('id',r.id):sb.from('regras').insert(p);var x=await q;if(x.error)throw x.error;
    S.regraEdit=null;toast('Regra salva');await refresh()}catch(e){fail(e)}},
  regraAtiva:async function(id,on){try{var r=await sb.from('regras').update({ativa:on,estado:'normal',condicao_desde:null}).eq('id',id);if(r.error)throw r.error;await refresh()}catch(e){fail(e)}},
  regraExcluir:async function(id){if(!confirm('Excluir esta regra?'))return;try{var r=await sb.from('regras').delete().eq('id',id);if(r.error)throw r.error;await refresh()}catch(e){fail(e)}},
  novoLocal:async function(){try{var n=val('nl-nome');if(!n)return;var r=await sb.from('locais').insert({cliente_id:S.perfil.cliente_id,nome:n});if(r.error)throw r.error;await refresh()}catch(e){fail(e)}},
  novoUsuario:async function(){try{var em=val('nu-email');if(!em)throw new Error('Informe o e-mail.');
    var locs=Array.prototype.slice.call(document.querySelectorAll('.nu-local:checked')).map(function(c){return c.value});
    var r=await sb.from('usuarios').insert({cliente_id:S.perfil.cliente_id,email:em.toLowerCase(),nome:val('nu-nome'),papel:el('nu-papel').value,locais:locs.length?locs:null});if(r.error)throw r.error;toast('Usuario autorizado');renderConfig()}catch(e){fail(e)}},
  removerUsuario:async function(id){if(!confirm('Remover o acesso deste usuario?'))return;try{var r=await sb.from('usuarios').delete().eq('id',id);if(r.error)throw r.error;renderConfig()}catch(e){fail(e)}}
};
async function enviarCmd(code,v){try{toast('Enviando comando…');var r=await sb.rpc('comandar_ui',{p_dispositivo_id:S.dispId,p_codigo:code,p_valor:v});if(r.error)throw r.error;
  if(r.data&&r.data.erro)throw new Error(r.data.erro);toast('Comando enviado');setTimeout(function(){sb.rpc('coletar_agora').then(refresh)},2500)}catch(e){fail(e)}}

// ---------- sessao ----------
async function onSession(session){
  clearInterval(S.timer);
  if(!session){S.perfil=null;S.perfis=[];render();return}
  try{
    var r=await sb.rpc('meu_perfil');if(r.error)throw r.error;
    S.perfis=r.data||[];
    if(!S.perfis.length){el('app').innerHTML='<div class="login"><h2>Acesso nao autorizado</h2><p>O e-mail <b>'+esc(session.user.email)+'</b> nao esta autorizado em nenhuma empresa. Peca ao administrador para incluir seu e-mail.</p><button class="btn sec" onclick="A.sair()">Sair</button></div>';return}
    S.perfil=S.perfis[0];
    await loadBase();render();
    S.timer=setInterval(function(){if(!S.regraEdit&&!S.agendaEdit)refresh()},60000);
  }catch(e){fail(e);el('app').innerHTML='<div class="login"><h2>Falha ao carregar</h2><p>'+esc(e.message)+'</p><button class="btn sec" onclick="location.reload()">Tentar de novo</button> <button class="btn sec" onclick="A.sair()">Sair</button></div>'}
}
sb.auth.onAuthStateChange(function(ev,session){if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')onSession(session)});
</script>
</body>
</html>
